<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" aria-label="The same published residue maps to different positions in UniProt and in each PDB structure. EGFR 1M17 needs an offset of minus 24; rice ALS needs minus 26."><rect width="900" height="430" fill="#FCFCFB"/><text x="40" y="38" font-size="19" font-weight="700" fill="#101E33" font-family="IBM Plex Sans, Arial, sans-serif">One residue, three numbering systems</text><text x="40" y="64" font-size="14" fill="#4C5A70" font-family="IBM Plex Sans, Arial, sans-serif">Every offset below was verified against the actual sequence, not assumed. Each is a silent-wrong-answer bug.</text><text x="40" y="104" font-size="15" font-weight="700" fill="#101E33" font-family="IBM Plex Sans, Arial, sans-serif">EGFR — published as <tspan font-family="JetBrains Mono, monospace">T790</tspan> (clinical numbering)</text><rect x="40" y="126" width="258" height="80" rx="10" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="2"/><text x="56" y="152" font-size="13" fill="#4C5A70" font-family="IBM Plex Sans, Arial, sans-serif">UniProt P00533</text><text x="56" y="182" font-size="24" font-weight="700" fill="#101E33" font-family="JetBrains Mono, monospace">T790</text><text x="282" y="182" font-size="17" font-weight="700" text-anchor="end" fill="#1F6FEB" font-family="JetBrains Mono, monospace">+0</text><rect x="314" y="126" width="258" height="80" rx="10" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="2"/><text x="330" y="152" font-size="13" fill="#4C5A70" font-family="IBM Plex Sans, Arial, sans-serif">PDB 1M17</text><text x="330" y="182" font-size="24" font-weight="700" fill="#101E33" font-family="JetBrains Mono, monospace">T766</text><text x="556" y="182" font-size="17" font-weight="700" text-anchor="end" fill="#C9741B" font-family="JetBrains Mono, monospace">−24</text><rect x="588" y="126" width="258" height="80" rx="10" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="2"/><text x="604" y="152" font-size="13" fill="#4C5A70" font-family="IBM Plex Sans, Arial, sans-serif">PDB 4ZAU</text><text x="604" y="182" font-size="24" font-weight="700" fill="#101E33" font-family="JetBrains Mono, monospace">T790</text><text x="830" y="182" font-size="17" font-weight="700" text-anchor="end" fill="#1F6FEB" font-family="JetBrains Mono, monospace">+0</text><text x="40" y="238" font-size="15" font-weight="700" fill="#101E33" font-family="IBM Plex Sans, Arial, sans-serif">rice ALS — published as <tspan font-family="JetBrains Mono, monospace">W574</tspan> (Arabidopsis numbering)</text><rect x="40" y="260" width="258" height="80" rx="10" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="2"/><text x="56" y="286" font-size="13" fill="#4C5A70" font-family="IBM Plex Sans, Arial, sans-serif">UniProt Q6K2E8</text><text x="56" y="316" font-size="24" font-weight="700" fill="#101E33" font-family="JetBrains Mono, monospace">W548</text><text x="282" y="316" font-size="17" font-weight="700" text-anchor="end" fill="#C9741B" font-family="JetBrains Mono, monospace">−26</text><rect x="314" y="260" width="258" height="80" rx="10" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="2"/><text x="330" y="286" font-size="13" fill="#4C5A70" font-family="IBM Plex Sans, Arial, sans-serif">PDB 1Z8N</text><text x="330" y="316" font-size="24" font-weight="700" fill="#101E33" font-family="JetBrains Mono, monospace">W574</text><text x="556" y="316" font-size="17" font-weight="700" text-anchor="end" fill="#1F6FEB" font-family="JetBrains Mono, monospace">+0</text><rect x="588" y="260" width="258" height="80" rx="10" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="2"/><text x="604" y="286" font-size="13" fill="#4C5A70" font-family="IBM Plex Sans, Arial, sans-serif">PDB 1YHZ</text><text x="604" y="316" font-size="24" font-weight="700" fill="#101E33" font-family="JetBrains Mono, monospace">W574</text><text x="830" y="316" font-size="17" font-weight="700" text-anchor="end" fill="#1F6FEB" font-family="JetBrains Mono, monospace">+0</text><rect x="40" y="372" width="820" height="74" rx="10" fill="#FAEBDA"/><text x="62" y="402" font-size="14" font-weight="700" fill="#8A4D10" font-family="IBM Plex Sans, Arial, sans-serif">The trap: A122 is alanine in BOTH ALS numbering systems, by coincidence.</text><text x="62" y="428" font-size="13" fill="#6B4414" font-family="IBM Plex Sans, Arial, sans-serif">A122T is the headline demo case, so it validates fine while every other site is silently wrong. Strict residue checks catch it.</text></svg>